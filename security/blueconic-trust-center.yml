controls:
  hosting: Amazon Web Services public cloud; multi-tier architecture segregating application systems from the public internet; private subnets behind a load balancer; firewall and routing restrictions on all network access.
  encryption_in_transit: HTTPS-only user interface; TLS 1.2 and 1.3 with keys of at least 128 bits; SFTP supported for third-party transfers.
  encryption_at_rest: AES-256 for customer data including backups; user-supplied remote-system credentials encrypted with a 256-bit key.
  authentication: Username, password and multi-factor authentication; enforced length/complexity/expiration; salted password hashes; SAML SSO integration; automatic session logout.
  secure_development: SDLC with security and privacy considerations, design and code review, unit and integration testing, recurring OWASP Top Ten secure-coding training.
  vulnerability_testing: SAST, SCA and DAST integrated into the SDLC; regular third-party platform vulnerability and penetration testing; risk/severity-based remediation; customer pen tests permitted with advance permission.
  availability: Redundant service clusters across multiple AWS Availability Zones; Business Continuity and Disaster Recovery program with frequent tests; live status at status.blueconic.com.
  incident_response: 24x7 security monitoring with automated alerting; documented Security Incident Response Plan covering roles, responsibilities and procedures.
  personnel: Background checks (education, employment, criminal history where lawful); written acknowledgement of data-protection responsibilities; least-privilege access with regular reviews and prompt revocation; mandatory security training.
  vulnerability_disclosure: security@blueconic.com — see security/blueconic-vulnerability-disclosure.yml.
