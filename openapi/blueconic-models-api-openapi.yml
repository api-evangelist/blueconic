              description: The creation date of the object. Datetime in UTC in the https://www.ietf.org/rfc/rfc3339.txt format, example = "2025-01-22T11:21:33.872Z".
              readOnly: true
            creator:
              $ref: '#/components/schemas/UserBean'
            description:
              type: string
              description: The description.
            featureNames:
              type: array
              description: The features that are used in the model. Only required for models of type `DIALOGUE`, `RECOMMENDATION` or `CONTINUOUS` and when an ONNX model is provided.
              items:
                type: string
                description: The features that are used in the model. Only required for models of type `DIALOGUE`, `RECOMMENDATION` or `CONTINUOUS` and when an ONNX model is provided.
            id:
              type: string
              description: The object ID.
            lastModifiedDate:
              type: string
              format: date-time
              description: The last modified date of the object. Datetime in UTC in the https://www.ietf.org/rfc/rfc3339.txt format, example = "2025-01-22T11:21:33.872Z".
              readOnly: true
            lastModifiedUser:
              $ref: '#/components/schemas/UserBean'
            modelHash:
              type: string
              description: The model hash which can be used to do conditional requests for retrieving the model binary. Either via the `etag` querystring parameter or the `If-None-Match` header.
              readOnly: true
            modelUrl:
              type: string
              description: The model url of the binary model. If not set, the model has no binary yet.
              readOnly: true
            name:
              type: string
              description: The object name.
            parameters:
              type: array
              description: The parameters of the object, containing optional key/values pairs.
              items:
                $ref: '#/components/schemas/parameter'
            profilePropertyIds:
              type: array
              description: The profile properties that are used in the model. Only required for models of type `DIALOGUE`, `RECOMMENDATION` or `CONTINUOUS`.
              items:
                type: string
                description: The profile properties that are used in the model. Only required for models of type `DIALOGUE`, `RECOMMENDATION` or `CONTINUOUS`.
            segmentId:
              type: string
              description: The segment ID this model is designated for (can be empty if the model can work on more than one segment). Only relevant for models of type `CONTINUOUS`.
            storeId:
              type: string
              description: The store ID of the content/product store this model is designated for (can be empty if the model can work on more than one store). Only relevant for models of type `RECOMMENDATION`.
            tags:
              type: array
              description: The tags (i.e. labels).
              example: Address
              items:
                type: string
                description: The tags (i.e. labels).
                example: Address
            type:
              type: string
              description: The type of the model. Must be one of the allowed model types `GENERAL`, `DIALOGUE`, `RECOMMENDATION` or `CONTINUOUS`.
              enum:
              - GENERAL
              - DIALOGUE
              - RECOMMENDATION
              - CONTINUOUS
          required:
          - type
        model:
          type: string
          format: binary
          description: The ONNX model to update (optional). This should be a valid ONNX model serialized as specified <a href='https://onnx.ai/onnx/api/serialization.html' target='_blank'>here</a>.
          writeOnly: true
    models:
      type: object
      properties:
        itemsPerPage:
          type: integer
          format: int32
          description: Number of results per page.
          readOnly: true
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelBean'
        startIndex:
          type: integer
          format: int32
          description: The start index.
          readOnly: true
        totalPages:
          type: integer
          format: int32
          description: The total number of pages.
          readOnly: true
        totalResults:
          type: integer
          format: int32
          description: The total number of results.
          readOnly: true
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'Authenticates a registered OAuth 2.0 client. The Authorization code flow and Client credentials flow are supported. Make sure to select the correct flow based on which flow the registered client supports. The client id and client secret can be found in BlueConic by opening the registered client under *Settings* > *Access management* > *Applications*.<br/>**NOTE:** When using the Authorization code flow, the redirect URL of the registered client in BlueConic must be set to `https://rest.apidoc.blueconic.com/oauth-receiver.html` and ''Send Proof Key for Code Exchange'' must be enabled.<br/><br/>To use a Bearer token for authentication, follow these steps: <br/>1. Acquire the token through authentication.<br/>2. Include the token in the request''s Authorization header as Bearer \<token\>.<br/>3. Send the request to access protected resources.<br/>4. Handle token expiration by refreshing or obtaining a new token.'
      flows:
        clientCredentials:
          tokenUrl: /rest/v2/oauth/token
        authorizationCode:
          authorizationUrl: /rest/v2/oauth/authorize
          tokenUrl: /rest/v2/oauth/token
          refreshUrl: /rest/v2/oauth/token
