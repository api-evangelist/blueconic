plan_count: 0
publishes_pricing: false
pricing_model:
  type: contact-sales
  self_serve: false
  free_tier: false
  trial: false
  billing_period_documented: null
  cost_drivers:
    - name: identifiable profiles
      note: >-
        The number of identifiable customer profiles is the dimension BlueConic's own FinOps
        framing and account documentation treat as the primary commercial unit. No rate card
        is published for it.
    - name: monthly visitor traffic
    - name: product subscriptions / licences
      note: >-
        Feature availability at each release stage is explicitly "available to all BlueConic
        customers, depending on product subscriptions or licenses"
        (https://support.blueconic.com/en/articles/247540-cdp-product-updates-and-current-status),
        so the platform is licensed by module as well as by volume.
plans: []
api_charges:
  separately_billed: false
  note: >-
    No separate API tier, per-call price or API quota is published. REST API v2 access is part
    of the platform; scope is controlled by OAuth application permissions rather than by plan.
  webhook_note: >-
    Webhook calls carry no hard published limit but are "subject to BlueConic's fair use
    policy" (https://support.blueconic.com/en/articles/247717-webhook-connection).
sandbox_access:
  self_serve: false
  note: >-
    A BlueConic Sandbox tenant requires the customer's organization to have "made the
    appropriate legal arrangements" — i.e. it is a contract term, not a signup.
    See sandbox/blueconic-sandbox.yml.
