controls_published:
  hosting: Amazon Web Services (public cloud), multi-tier architecture, private subnets
  encryption_in_transit: TLS 1.2 and 1.3, minimum 128-bit keys, HTTPS-only UI
  encryption_at_rest: AES-256, including backups
  authentication: username + password + MFA, salted password hashes, SAML SSO supported
  testing: SAST, SCA, DAST in the SDLC plus regular third-party platform pen tests
  secure_development: design and code review, OWASP Top Ten training
  availability: redundant clusters across multiple AWS Availability Zones, BC/DR program with regular tests
  monitoring: 24x7 security monitoring with automated alerting; documented Security Incident Response Plan
  personnel: background checks, least privilege, regular access reviews, mandatory security training
  source: https://www.blueconic.com/trust-center
