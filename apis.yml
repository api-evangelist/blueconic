apis:
- aid: blueconic:blueconic-audit-events-api
  name: BlueConic Audit Events API
  description: "The Audit Event API allows users to connect BlueConic to a SIEM system. We recommend using\
    \ this API to periodically receive security-related activities based on a rolling window. The API\
    \ has a 30-day retention period.\n\nThe API logs the following audit events:\n\n| Object         \
    \            | Events                                                                            \
    \             |\n|:---------------------------|:-----------------------------------------------------------------------------------------------|\n\
    | BlueConic hostname         | Create, Update, Delete                                            \
    \                             |\n| BlueConic Support Access   | Update (for each change)         \
    \                                                              |\n| Channel                    | Create,\
    \ Update, Delete                                                                         |\n| Clean\
    \ up rule              | Create, Update, Delete                                                  \
    \                       |\n| Connection                 | Create, Update, Delete, Manual run, Scheduled\
    \ run                                              |\n| Dashboard                  | Create, Update,\
    \ Delete                                                                         |\n| Dialogue   \
    \                | Create, Update, Delete                                                        \
    \                 |\n| Domain Group               | Create, Update, Delete                       \
    \                                                  |\n| Gen AI Setting             | Update (for each\
    \ change)                                                                       |\n| Group       \
    \               | Read, Update, Delete                                                           \
    \                |\n| Group type                 | Create, Update, Delete                        \
    \                                                 |\n| Ip range                   | Create, Update,\
    \ Delete                                                                         |\n| Language   \
    \                | Create, Update, Delete                                                        \
    \                 |\n| Lifecycle                  | Create, Update, Delete                       \
    \                                                  |\n| Merge rule                 | Create, Update,\
    \ Delete                                                                         |\n| Models     \
    \                | Create, Update, Delete                                                        \
    \                 |\n| Notebook                   | Create, Update, Delete, Manual run, Scheduled\
    \ run, Editor run                                  |\n| OAuth application          | Create, Update,\
    \ Delete                                                                         |\n| OAuth token\
    \                | Create, Update, Delete                                                        \
    \                 |\n| Objective                  | Create, Update, Delete                       \
    \                                                  |\n| Plugin                     | Create, Update,\
    \ Delete                                                                         |\n| Privacy setting\
    \            | Update (for each change)                                                          \
    \             |\n| Profile                    | Read, Update, Delete                             \
    \                                              |\n| Profile property           | Create, Update, Delete\
    \                                                                         |\n| Role              \
    \         | Create, Update, Delete                                                               \
    \          |\n| Segment                    | Create, Update, Delete                              \
    \                                           |\n| Single Sign On Setting     | Update (for each change)\
    \                                                                       |\n| Inactvity Setting   \
    \       | Update (for each change)                                                               \
    \        |\n| Supported Legislation Zone | Create, Delete, Update                                \
    \                                         |\n| Timeline Event Rollup      | Create, Update, Delete\
    \                                                                         |\n| Timeline Event Type\
    \        | Create, Update, Delete                                                                \
    \         |\n| Tracker                    | Create, Update, Delete                               \
    \                                          |\n| User                       | Login, Login failed,\
    \ Logout, Create, Update, Delete, Password reset requested, Password change |\n\n\nOnly Profile and\
    \ Group viewed, updated, or deleted by a user from the Profile and Groups tab are logged.\n\nThe following\
    \ events are not considered as human actions, and therefore not covered in the Platform\nAudit Event\
    \ API:\n\n- Connections that import or export profiles.\n- Profile and group creation (Profiles can\
    \ only be created by a visitor or an import connection).\n\n**Event data**\n\nThe following event\
    \ data is available:\n\n| Field                  | Description      | Example values             \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                            |\n| :---                   | :---             |:-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n\
    |date|Datetime in UTC when the event occurred. The date is in the https://www.ietf.org/rfc/rfc3339.txt\
    \ format.| 2025-04-15T11:24:01.183Z                                                              \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                 |\n|username|(BlueConic)\
    \ Identifier (email address) of the user who did the action.<br /><br />Value is empty for failed\
    \ login attempts.| test@blueconic.com                                                            \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                         |\n|objectType|Object\
    \ of the action.| <ul><li>BLUECONIC_HOSTNAME</li><li>BLUECONIC_SUPPORT_ACCESS_SETTING</li><li>CHANNEL</li><li>CLEAN_UP_RULE</li><li>CONNECTION</li><li>DASHBOARD</li><li>DIALOGUE</li><li>DOMAIN_GROUP</li><li>GEN_AI_SETTING</li><li>GROUP</li><li>GROUP_TYPE</li><li>IP_RANGE</li><li>LANGUAGE</li><li>LIFECYCLE</li><li>LISTENER</li><li>MERGE_RULE</li><li>NOTEBOOK</li><li>OBJECTIVE</li><li>PLUGIN</li><li>PRIVACY_SETTING</li><li>PROFILE</li><li>PROFILE_PROPERTY</li><li>ROLE</li><li>SEGMENT</li><li>SINGLE_SIGN_ON_SETTING</li><li>SUPPORTED_LEGISLATION_ZONE</li><li>TRACKER</li><li>USER</li></ul>\
    \ |\n|objectId|<ul><li>Email address in case of a user. <ul><li>In the case of LOGIN_FAILED and a\
    \ user tried to login with an invalid format email address, it could be that the user filled the password\
    \ in the email address field. In that case the objectId is empty</li></ul></li><li>Grouptype_GroupID\
    \ in case of a group</li><li> For PRIVACY_SETTING and SINGLE_SIGN_ON_SETTING, the objectId is the\
    \ name(s) of the changed setting. E.g. Status, Identity_Provider_Issuer_URL_Entity_ID.</li><li> For\
    \ BLUECONIC_SUPPORT_ACCESS_SETTING the objectID contains the new settings.<ul><li> `\"objects\" :\
    \ [ {\"name\" : \"No Access\", \"id\" : \"none\" } ]` or </li><li>`\"objects\" : [ {\"name\" : \"\
    User name here\", \"id\" : \"user1@blueconic.com\" },{\"name\" : \"User name 2 here\", \"id\" : \"\
    user2@blueconic.com\" }], (contains the new list)` or</li><li>`\"objects\" : [ {\"name\" : \"All BlueConic\
    \ support employees\", \"id\" : \"all\" } ],`</li></ul></li><li>UUID or identifier in case of other\
    \ object types.</li></ul>| <ul><li>1b1e50a5-c46a-4309-a95c-d4e19985fbbb</li><li>test@blueconic.com</li><li>test_objective</li><li>test_profile_property</li></ul>\
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                 |\n|objectName|<p>Human readable name of the object.</p><p>For Profiles,\
    \ the name is determined by the first value that is not empty:</p><ol><li>fullname</li><li>email</li><li>BlueConic\
    \ ID (UUID)</li></ol><p>For Users, the name is determined by the first value that is not empty:</p><ol><li>fullname</li><li>email</li></ol><ul><li>In\
    \ the case of LOGIN_FAILED and a user tried to login with an invalid format email address, it could\
    \ be that the user filled the password in the email address field. In that case, the objectName is\
    \ empty.</li></ul><p>For groups, the name is the group id.</p><p><span>For PRIVACY_SETTING and SINGLE_SIGN_ON_SETTING,\
    \ the objectName is the name(s) of the changed setting. E.g. Status, Identity_Provider_Issuer_URL_Entity_ID.</span></p><p>For\
    \ BLUECONIC_SUPPORT_ACCESS_SETTING the objectName contains the new settings.</p><ul><li><p>`\"objects\"\
    \ : [ {\"name\" : \"No Access\", \"id\" : \"none\" } ]` or</p></li><li ><p> `\"objects\" : [ {\"name\"\
    \ : \"User name here\", \"id\" : \"user1@blueconic.com\" },{\"name\" : \"User name 2 here\", \"id\"\
    \ : \"user2@blueconic.com\" }],` (contains the new list) or</p></li><li><p>`\"objects\" : [ {\"name\"\
    \ : \"All BlueConic support employees\", \"id\" : \"all\" } ],`</p></li></ul>| <ul><li>SFTP connection</li><li>test@blueconic.om</li><li>Keyword\
    \ Interest Ranking</li>                                                                          \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \      |\n|operation| Action performed on the object.                                            \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                             | <ul><li>CREATE</li><li>UPDATE</li><li>DELETE</li><li>EDITOR_RUN</li><li>READ</li><li>LOGIN</li><li>LOGIN_FAILED</li><li>LOGOUT</li><li>MANUAL_RUN</li><li>PASSWORD_RESET_REQUESTED</li><li>PASSWORD_CHANGE</li><li>SCHEDULED_RUN</li></ul>\
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                             \n|ipAddress| The source IP address from which the event was triggered.\
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                               | 192.168.1.100  \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                        |\n|application| The application that performed\
    \ the audit event operation.                                                                     \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \           | blueconic                                                                          \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                    |"
