method: derived
source: openapi/ + mcp/blueconic-mcp.yml
description: 'Crosswalk between the BlueConic MCP surface and the BlueConic REST API v2 OpenAPI. BlueConic''s
  MCP server is a DYNAMIC OpenAPI adapter: it loads the connected tenant''s own OpenAPI at startup and
  turns its supported REST operations into tools, so there is no published static tool catalog to align
  against and tools/list is auth-gated behind tenant OAuth credentials. Every row below is therefore derived
  from a real operation in openapi/ rather than from an observed tool name, and confidence is set to medium
  throughout: the operation and its parameters/requestBody are real and are the tool''s true input contract,
  but the exact tool NAME the server generates was not observed. Delete operations are listed under rest_only
  because BlueConic documents that the server does not expose them.'
surfaces:
  openapi:
    files: openapi/*.yml
    original: openapi/_original/blueconic-rest-api-v2-openapi.yml
    operations: 64
    gated: false
  mcp:
    endpoint: https://{tenantname}.blueconic.net/mcp
    local: npx -y @blueconic/blueconic-mcp
    tools_list_gated: true
    note: Anonymous POST to https://tenantname.blueconic.net/mcp returned HTTP 403 on 2026-08-13.
  graphql: null
