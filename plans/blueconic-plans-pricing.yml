name: BlueConic Plans and Pricing
description: >-
  BlueConic publishes NO pricing. www.blueconic.com/pricing redirects (HTTP 200 after redirect)
  to www.blueconic.com/contact, and every commercial path on the site — "book a demo",
  "Request a Demo", "Sign in" — leads to /request-demo. There are no named tiers, no list
  price, no published quota and no self-service signup. Pricing is negotiated per contract.
  This file records that absence; it is not a reconstruction of a price list.
version: '0.2'
